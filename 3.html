<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="sheet-id" content="3">
    <title>Spreadsheet Pro</title>
    <noscript>
        <link rel="stylesheet" href="style.css">
    </noscript>
</head>
<body>
    <div class="spreadsheet-container" data-sheet-id="3" data-current-sheet="3">
        <div class="grid-container">
            <div class="corner-cell"></div>
            <div class="column-headers">
                <div class="header-content" id="columnHeaderContent"></div>
            </div>
            <div class="row-headers">
                <div class="header-content" id="rowHeaderContent"></div>
            </div>
            <div class="main-grid" id="mainGrid">
                <div class="grid-content" id="gridContent"></div>
            </div>
        </div>
        <div class="sheet-tabs-embed">
            <iframe class="sheet-tabs-iframe" src="index.html#sheet3" title="Click here for sheet selection" loading="lazy" scrolling="no" name="Click here for sheet selection"></iframe>
        </div>
    </div>
</body>
</html>
