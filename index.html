<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet Tabs</title>
    <base target="_parent">
    <link rel="stylesheet" href="style.css">
    <script>
        // Fallback to local assets when loader.js cannot be fetched
        function loadLocalAssetsFallback() {
            if (window.__tabsLocalAssetFallbackApplied) return;
            window.__tabsLocalAssetFallbackApplied = true;
            var script = document.createElement('script');
            script.src = 'app.js';
            script.defer = true;
            document.head.appendChild(script);
        }
        (function() {
            if (window.self !== window.top) return;
            const target = '1.html' + (window.location.search || '') + (window.location.hash || '');
            try { window.location.replace(target); } catch (e) { window.location.href = target; }
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=1.html">
    </noscript>
</head>
<body class="tabs-only">
    <!-- Only these links exist in HTML - visible only to no-JS browsers -->
    <noscript>
        <!-- This would redirect automatically in elinks <meta http-equiv="refresh" content="0;url=1.html"> -->
        <nav class="sheet-tabs sheet-tabs--fallback" aria-label="Spreadsheets" data-current-sheet="1">
            <span class="sheet-tab sheet-tab--add heart-fallback" title="JavaScript required" aria-label="JavaScript required">❥</span>
            <a class="sheet-tab sheet-tab--active" href="1.html" aria-current="page">Sheet 1</a>
            <a class="sheet-tab" href="2.html">Sheet 2</a>
        </nav>
        <style>
            .heart-fallback {
                font-size: 0;
            }
            .heart-fallback::before {
                content: '❤';
                font-size: 1rem;
            }
        </style>
    </noscript>
    
    <!-- Empty nav - tabs will be added by JavaScript -->
    <nav id="sheetTabs" class="sheet-tabs" aria-label="Spreadsheets" data-current-sheet="1">
        <div class="sheet-tabs__list">
            <!-- JavaScript will populate this -->
        </div>
    </nav>
    
    <script>
        // Dynamically create tabs for JS-enabled browsers
        (function() {
            const tabsContainer = document.getElementById('sheetTabs');
            if (!tabsContainer) return;
            
            const tabsList = tabsContainer.querySelector('.sheet-tabs__list');
            if (!tabsList) return;
            
            // Get current sheet from data attribute
            const currentSheet = tabsContainer.dataset.currentSheet || '1';
            
            // Find the noscript fallback to extract sheet info
            const noscriptFallback = document.querySelector('.sheet-tabs--fallback');
            const sheets = [];
            
            if (noscriptFallback) {
                const fallbackLinks = noscriptFallback.querySelectorAll('a');
                fallbackLinks.forEach(link => {
                    // Extract sheet number from href (e.g., "1.html" -> "1")
                    const match = link.href.match(/(\d+)\.html/);
                    if (match) {
                        sheets.push({
                            id: match[1],
                            href: link.href,
                            label: link.textContent.trim()
                        });
                    }
                });
            }
            
            // Fallback if no sheets found
            if (sheets.length === 0) {
                sheets.push(
                    { id: '1', href: '1.html', label: 'Sheet 1' },
                    { id: '2', href: '2.html', label: 'Sheet 2' }
                );
            }
            
            // Create and add the "Add" button
            const addButton = document.createElement('a');
            addButton.className = 'sheet-tab sheet-tab--add';
            addButton.href = '#add-sheet';
            addButton.dataset.sheetAdd = 'true';
            addButton.title = 'Add sheet';
            addButton.setAttribute('aria-label', 'Add sheet');
            addButton.textContent = '+';
            
            tabsContainer.insertBefore(addButton, tabsList);
            
            // Create sheet tabs
            sheets.forEach(sheet => {
                const tab = document.createElement('a');
                tab.className = 'sheet-tab';
                tab.href = sheet.href;
                tab.dataset.sheetId = sheet.id;
                tab.textContent = sheet.label;
                
                if (sheet.id === currentSheet) {
                    tab.classList.add('sheet-tab--active');
                    tab.setAttribute('aria-current', 'page');
                }
                
                tabsList.appendChild(tab);
            });
        })();
    </script>
    
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search || '');
            const preferLocal = ['1', 'true', 'local'].includes((params.get('localAssets') || '').toLowerCase()) || window.location.protocol === 'file:';
            if (preferLocal) {
                loadLocalAssetsFallback();
                return;
            }
            const script = document.createElement('script');
            script.src = 'loader.js';
            script.defer = true;
            script.onerror = loadLocalAssetsFallback;
            document.body.appendChild(script);
        }());
    </script>
</body>
</html>
