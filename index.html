<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Spreadsheet Tabs</title>
    <base target="_top">
    <link rel="stylesheet" href="style.css">
</head>
<body class="tabs-only">
    <!-- Single navigation bar - each link serves as both marker and tab -->
    <nav class="sheet-tabs" aria-label="Spreadsheets">
        <a class="sheet-tab sheet-tab--add" href="#add-sheet" title="Add sheet" aria-label="Add sheet">+</a>
        <a id="sheet1" class="sheet-tab" href="1.html" data-sheet-id="1">Sheet 1</a>
        <a id="sheet2" class="sheet-tab" href="2.html" data-sheet-id="2">Sheet 2</a>
        <a id="sheet3" class="sheet-tab" href="3.html" data-sheet-id="3">Sheet 3</a>
        <!-- To add Sheet 4: <a id="sheet4" class="sheet-tab" href="4.html" data-sheet-id="4">Sheet 4</a> -->
    </nav>
</body>
</html>
