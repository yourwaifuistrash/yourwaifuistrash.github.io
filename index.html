<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Spreadsheet Tabs</title>
    <base target="_top">
    <noscript>
        <link rel="stylesheet" href="style.css">
    </noscript>
    <script>
        // Fallback to local assets when loader.js cannot be fetched
        function loadLocalAssetsFallback() {
            if (window.__tabsLocalAssetFallbackApplied) return;
            window.__tabsLocalAssetFallbackApplied = true;

            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = 'style.css';
            document.head.appendChild(stylesheet);

            var script = document.createElement('script');
            script.src = 'app.js';
            script.defer = true;
            document.head.appendChild(script);
        }
        (function() {
            if (window.self !== window.top) return;
            const target = '1.html' + (window.location.search || '') + (window.location.hash || '');
            try { window.location.replace(target); } catch (e) { window.location.href = target; }
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=1.html">
    </noscript>
</head>
<body class="tabs-only">
    <!-- Only these links exist in HTML - visible only to no-JS browsers -->
    <noscript>
        <!-- This would redirect automatically in elinks <meta http-equiv="refresh" content="0;url=1.html"> -->
        <nav class="sheet-tabs sheet-tabs--fallback" aria-label="Spreadsheets" data-current-sheet="1">
            <span class="sheet-tab sheet-tab--add heart-fallback" title="JavaScript required" aria-label="JavaScript required"><span>❥</span></span>
            <a class="sheet-tab sheet-tab--active" href="1.html" aria-current="page">Sheet 1</a>
            <a class="sheet-tab" href="2.html">Sheet 2</a>
        </nav>
    </noscript>
    
    <!-- Empty nav - tabs will be added by JavaScript -->
    <nav id="sheetTabs" class="sheet-tabs" aria-label="Spreadsheets" data-current-sheet="1">
        <div class="sheet-tabs__list">
            <!-- JavaScript will populate this -->
        </div>
    </nav>
    
    <script>
        // Dynamically create tabs for JS-enabled browsers
        (function() {
            // Sync current sheet from parent for CSS-only highlighting
            function syncCurrentSheetFromParent() {
                const tabsContainer = document.getElementById('sheetTabs');
                if (!tabsContainer) return;
                
                try {
                    if (window.parent && window.parent !== window) {
                        const parentContainer = window.parent.document.querySelector('.spreadsheet-container');
                        if (parentContainer) {
                            const currentSheet = parentContainer.getAttribute('data-current-sheet') || 
                                               parentContainer.getAttribute('data-sheet-id') || '1';
                            tabsContainer.setAttribute('data-current-sheet', currentSheet);
                        }
                    }
                } catch (e) {
                    // Cross-origin, use default
                    console.log('Cannot access parent, using default');
                }
            }
            
            function createAddButton(tabsContainer) {
                // Remove existing add button if present
                const existing = tabsContainer.querySelector('.sheet-tab--add');
                if (existing) existing.remove();
                
                // Create the add button
                const addButton = document.createElement('a');
                addButton.className = 'sheet-tab sheet-tab--add';
                addButton.href = '#add-sheet';
                addButton.dataset.sheetAdd = 'true';
                addButton.title = 'Add sheet';
                addButton.setAttribute('aria-label', 'Add sheet');
                addButton.textContent = '+';
                
                // Insert at the beginning of the nav
                tabsContainer.insertBefore(addButton, tabsContainer.firstChild);
            }
            
            function createTabs() {
                const tabsContainer = document.getElementById('sheetTabs');
                if (!tabsContainer) return;
                
                // Sync current sheet for CSS-only highlighting
                syncCurrentSheetFromParent();
                
                let tabsList = tabsContainer.querySelector('.sheet-tabs__list');
                
                // Create tabsList if it doesn't exist
                if (!tabsList) {
                    tabsList = document.createElement('div');
                    tabsList.className = 'sheet-tabs__list';
                    tabsContainer.appendChild(tabsList);
                }
                
                // Get current sheet from data attribute
                const currentSheet = tabsContainer.dataset.currentSheet || '1';
                
                // Find the noscript fallback to extract sheet info
                const noscriptFallback = document.querySelector('.sheet-tabs--fallback');
                const sheets = [];
                
                if (noscriptFallback) {
                    const fallbackLinks = noscriptFallback.querySelectorAll('a');
                    fallbackLinks.forEach(link => {
                        // Extract sheet number from href (e.g., "1.html" -> "1")
                        const match = link.href.match(/(\d+)\.html/);
                        if (match) {
                            sheets.push({
                                id: match[1],
                                href: link.href,
                                label: link.textContent.trim()
                            });
                        }
                    });
                }
                
                // Fallback if no sheets found
                if (sheets.length === 0) {
                    sheets.push(
                        { id: '1', href: '1.html', label: 'Sheet 1' },
                        { id: '2', href: '2.html', label: 'Sheet 2' }
                    );
                }
                
                // Create and add the "Add" button
                createAddButton(tabsContainer);
                
                // Clear existing sheet tabs in the list
                tabsList.innerHTML = '';
                
                // Create sheet tabs
                sheets.forEach(sheet => {
                    const tab = document.createElement('a');
                    tab.className = 'sheet-tab';
                    tab.href = sheet.href;
                    tab.dataset.sheetId = sheet.id;
                    tab.textContent = sheet.label;
                    
                    // Removed active class logic - using CSS-only solution instead
                    if (sheet.id === currentSheet) {
                        tab.setAttribute('aria-current', 'page');
                    }
                    
                    tabsList.appendChild(tab);
                });
            }
            
            // Run immediately if DOM is already loaded
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', createTabs);
            } else {
                createTabs();
            }
            
            // Also run after a short delay to ensure it works in iframe context
            setTimeout(createTabs, 50);
            
            // Watch for changes to the tabs container in case external scripts modify it
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    // If the + button was removed, recreate it
                    const tabsContainer = document.getElementById('sheetTabs');
                    if (tabsContainer && !tabsContainer.querySelector('.sheet-tab--add')) {
                        createAddButton(tabsContainer);
                    }
                });
            });
            
            // Start observing once the DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    const tabsContainer = document.getElementById('sheetTabs');
                    if (tabsContainer) {
                        observer.observe(tabsContainer, { childList: true, subtree: true });
                    }
                });
            } else {
                const tabsContainer = document.getElementById('sheetTabs');
                if (tabsContainer) {
                    observer.observe(tabsContainer, { childList: true, subtree: true });
                }
            }
        })();
    </script>
    
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search || '');
            const preferLocal = ['1', 'true', 'local'].includes((params.get('localAssets') || '').toLowerCase()) || window.location.protocol === 'file:';
            if (preferLocal) {
                loadLocalAssetsFallback();
                return;
            }
            const script = document.createElement('script');
            script.src = 'loader.js';
            script.defer = true;
            script.onerror = loadLocalAssetsFallback;
            document.body.appendChild(script);
        }());
    </script>
</body>
</html>
