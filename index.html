<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Cell Selection Logger</title>
<style>
:root {
  --universal-color: red;
}
*:not(select) {
  color: var(--universal-color);
}
::selection {
  background-color: yellow;
  color: black;
  outline: dashed;
}
:active {
  background-color: yellow;
  color: black;
  outline: dashed;
}
td:focus {
  background-color: yellow;
  color: black;
  outline: dashed;
}
table {
  border-collapse: collapse;
  margin: 20px;
}
td {
  border: 1px solid #ccc;
  padding: 10px 20px;
  cursor: pointer;
  position: relative;
}
td.manually-selected {
  background-color: lightblue !important;
}
.info {
  margin: 20px;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 5px;
}
.log-entry {
  font-family: monospace;
  margin: 5px 0;
  padding: 5px;
  background: white;
  border-left: 3px solid blue;
}
</style>
</head>
<body>

<div class="info">
  <h3>Table Selection Logger</h3>
  <p>Try different selection methods:</p>
  <ul>
    <li>Click cells normally</li>
    <li>Ctrl+Click (Firefox) for multi-selection</li>
    <li>Shift+Click for range selection</li>
    <li>Drag to select text</li>
    <li>Edit contenteditable cells</li>
  </ul>
</div>

<table id="myTable">
  <tr>
    <td data-row="0" data-col="0">A</td>
    <td data-row="0" data-col="1">B</td>
    <td data-row="0" data-col="2">C</td>
  </tr>
  <tr>
    <td data-row="1" data-col="0" contenteditable="true">D (editable)</td>
    <td data-row="1" data-col="1" contenteditable="true">E (editable)</td>
    <td data-row="1" data-col="2" contenteditable="true">F (editable)</td>
  </tr>
  <tr>
    <td data-row="2" data-col="0">G</td>
    <td data-row="2" data-col="1">H</td>
    <td data-row="2" data-col="2">I</td>
  </tr>
</table>

<div id="logContainer" class="info">
  <h3>Selection Log:</h3>
  <button onclick="clearLog()">Clear Log</button>
  <div id="log"></div>
</div>

<script>
// Store for manually tracked selections
const manuallySelectedCells = new Set();
let lastClickedCell = null;
let selectionCounter = 0;

// Utility function for verbose logging
function verboseLog(message, data = {}) {
  selectionCounter++;
  const timestamp = new Date().toLocaleTimeString('en-US', { 
    hour12: false, 
    hour: '2-digit', 
    minute: '2-digit', 
    second: '2-digit', 
    fractionalSecondDigits: 3 
  });
  
  console.group(`[${timestamp}] Selection Event #${selectionCounter}: ${message}`);
  console.log('Message:', message);
  if (Object.keys(data).length > 0) {
    console.log('Event Data:', data);
  }
  console.groupEnd();
  
  // Also add to visual log
  const logDiv = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
  if (Object.keys(data).length > 0) {
    entry.innerHTML += `<br><small>${JSON.stringify(data, null, 2)}</small>`;
  }
  logDiv.insertBefore(entry, logDiv.firstChild);
  
  // Keep only last 20 entries in visual log
  while (logDiv.children.length > 20) {
    logDiv.removeChild(logDiv.lastChild);
  }
}

// Clear log function
function clearLog() {
  document.getElementById('log').innerHTML = '';
  selectionCounter = 0;
  console.clear();
  verboseLog('Log cleared');
}

// Get cell info
function getCellInfo(cell) {
  if (!cell || cell.tagName !== 'TD') return null;
  return {
    content: cell.textContent.trim(),
    row: cell.dataset.row,
    col: cell.dataset.col,
    isEditable: cell.contentEditable === 'true',
    cellId: `R${cell.dataset.row}C${cell.dataset.col}`
  };
}

// Handle native Selection API
function checkNativeSelection() {
  const selection = window.getSelection();
  
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    const selectedText = selection.toString();
    
    // Find all TD elements that contain selected content
    const allCells = document.querySelectorAll('td');
    const cellsWithSelection = [];
    
    allCells.forEach(cell => {
      if (selection.containsNode(cell, true)) {
        cellsWithSelection.push(getCellInfo(cell));
      }
    });
    
    if (selectedText.length > 0 || cellsWithSelection.length > 0) {
      verboseLog('Native Selection Detected', {
        type: 'Native Selection API',
        selectedText: selectedText || '(empty)',
        selectionType: selection.type,
        isCollapsed: selection.isCollapsed,
        anchorNode: selection.anchorNode ? selection.anchorNode.nodeName : null,
        focusNode: selection.focusNode ? selection.focusNode.nodeName : null,
        rangeCount: selection.rangeCount,
        cellsAffected: cellsWithSelection,
        rangeDetails: {
          startContainer: range.startContainer.nodeName,
          startOffset: range.startOffset,
          endContainer: range.endContainer.nodeName,
          endOffset: range.endOffset,
          collapsed: range.collapsed
        }
      });
    }
  }
}

// Cell click handler
function handleCellClick(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  const cellInfo = getCellInfo(cell);
  const modifiers = {
    ctrl: event.ctrlKey,
    shift: event.shiftKey,
    alt: event.altKey,
    meta: event.metaKey
  };
  
  verboseLog('Cell Click Event', {
    type: 'Click',
    cell: cellInfo,
    modifiers: modifiers,
    button: event.button === 0 ? 'left' : event.button === 1 ? 'middle' : 'right',
    detail: event.detail // number of clicks
  });
  
  // Handle Ctrl+Click for manual multi-selection (Firefox)
  if (event.ctrlKey) {
    if (manuallySelectedCells.has(cell)) {
      manuallySelectedCells.delete(cell);
      cell.classList.remove('manually-selected');
      verboseLog('Cell Deselected (Ctrl+Click)', {
        type: 'Manual Multi-Selection',
        action: 'DESELECT',
        cell: cellInfo,
        totalSelected: manuallySelectedCells.size,
        allSelectedCells: Array.from(manuallySelectedCells).map(c => getCellInfo(c))
      });
    } else {
      manuallySelectedCells.add(cell);
      cell.classList.add('manually-selected');
      verboseLog('Cell Added to Selection (Ctrl+Click)', {
        type: 'Manual Multi-Selection',
        action: 'SELECT',
        cell: cellInfo,
        totalSelected: manuallySelectedCells.size,
        allSelectedCells: Array.from(manuallySelectedCells).map(c => getCellInfo(c))
      });
    }
  }
  
  // Handle Shift+Click for range selection
  else if (event.shiftKey && lastClickedCell) {
    const startInfo = getCellInfo(lastClickedCell);
    const endInfo = cellInfo;
    
    // Calculate range
    const minRow = Math.min(parseInt(startInfo.row), parseInt(endInfo.row));
    const maxRow = Math.max(parseInt(startInfo.row), parseInt(endInfo.row));
    const minCol = Math.min(parseInt(startInfo.col), parseInt(endInfo.col));
    const maxCol = Math.max(parseInt(startInfo.col), parseInt(endInfo.col));
    
    // Clear previous manual selections
    manuallySelectedCells.forEach(c => c.classList.remove('manually-selected'));
    manuallySelectedCells.clear();
    
    // Select range
    const rangeCells = [];
    document.querySelectorAll('td').forEach(td => {
      const row = parseInt(td.dataset.row);
      const col = parseInt(td.dataset.col);
      if (row >= minRow && row <= maxRow && col >= minCol && col <= maxCol) {
        manuallySelectedCells.add(td);
        td.classList.add('manually-selected');
        rangeCells.push(getCellInfo(td));
      }
    });
    
    verboseLog('Range Selection (Shift+Click)', {
      type: 'Range Selection',
      startCell: startInfo,
      endCell: endInfo,
      rangeSize: `${maxRow - minRow + 1}x${maxCol - minCol + 1}`,
      totalCells: rangeCells.length,
      selectedCells: rangeCells
    });
  }
  
  // Regular click - clear manual selections
  else if (!event.ctrlKey) {
    if (manuallySelectedCells.size > 0) {
      manuallySelectedCells.forEach(c => c.classList.remove('manually-selected'));
      const previousCount = manuallySelectedCells.size;
      manuallySelectedCells.clear();
      verboseLog('Manual Selections Cleared', {
        type: 'Selection Clear',
        previousCount: previousCount,
        trigger: 'Regular Click'
      });
    }
    manuallySelectedCells.add(cell);
    cell.classList.add('manually-selected');
    verboseLog('Single Cell Selected', {
      type: 'Single Selection',
      cell: cellInfo
    });
  }
  
  lastClickedCell = cell;
  
  // Check native selection after a short delay
  setTimeout(checkNativeSelection, 10);
}

// Focus and blur handlers for contenteditable
function handleFocus(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Cell Focused', {
    type: 'Focus',
    cell: getCellInfo(cell),
    trigger: event.type,
    relatedTarget: event.relatedTarget ? event.relatedTarget.tagName : null
  });
}

function handleBlur(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Cell Blurred', {
    type: 'Blur',
    cell: getCellInfo(cell),
    trigger: event.type,
    relatedTarget: event.relatedTarget ? event.relatedTarget.tagName : null
  });
}

// Selection change handler
function handleSelectionChange() {
  const selection = window.getSelection();
  
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    
    // Check if selection is within a table cell
    let node = range.commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) {
      node = node.parentNode;
    }
    const cell = node.closest ? node.closest('td') : null;
    
    if (cell) {
      verboseLog('Selection Changed in Cell', {
        type: 'Selection Change',
        cell: getCellInfo(cell),
        selectedText: selection.toString(),
        selectionType: selection.type,
        isCollapsed: selection.isCollapsed,
        rangeCount: selection.rangeCount
      });
    }
  }
}

// Mouse selection handlers
function handleMouseDown(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Mouse Down on Cell', {
    type: 'Mouse Down',
    cell: getCellInfo(cell),
    button: event.button,
    modifiers: {
      ctrl: event.ctrlKey,
      shift: event.shiftKey,
      alt: event.altKey,
      meta: event.metaKey
    }
  });
}

function handleMouseUp(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Mouse Up on Cell', {
    type: 'Mouse Up',
    cell: getCellInfo(cell),
    button: event.button
  });
  
  // Check for text selection
  setTimeout(checkNativeSelection, 10);
}

// Input handler for contenteditable
function handleInput(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Cell Content Changed', {
    type: 'Input',
    cell: getCellInfo(cell),
    inputType: event.inputType,
    data: event.data,
    newContent: cell.textContent
  });
}

// Keyboard handler
function handleKeyDown(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  // Log significant keys
  if (['Enter', 'Tab', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key) ||
      event.ctrlKey || event.metaKey) {
    verboseLog('Key Pressed in Cell', {
      type: 'KeyDown',
      cell: getCellInfo(cell),
      key: event.key,
      code: event.code,
      modifiers: {
        ctrl: event.ctrlKey,
        shift: event.shiftKey,
        alt: event.altKey,
        meta: event.metaKey
      }
    });
  }
}

// Double-click handler
function handleDoubleClick(event) {
  const cell = event.target.closest('td');
  if (!cell) return;
  
  verboseLog('Cell Double-Clicked', {
    type: 'Double Click',
    cell: getCellInfo(cell),
    selectedText: window.getSelection().toString()
  });
}

// Set up all event listeners
document.addEventListener('DOMContentLoaded', () => {
  const table = document.getElementById('myTable');
  
  // Click events
  table.addEventListener('click', handleCellClick);
  table.addEventListener('dblclick', handleDoubleClick);
  
  // Mouse events
  table.addEventListener('mousedown', handleMouseDown);
  table.addEventListener('mouseup', handleMouseUp);
  
  // Focus events
  table.addEventListener('focus', handleFocus, true);
  table.addEventListener('blur', handleBlur, true);
  
  // Input events
  table.addEventListener('input', handleInput);
  
  // Keyboard events
  table.addEventListener('keydown', handleKeyDown);
  
  // Selection change (fires on document)
  document.addEventListener('selectionchange', handleSelectionChange);
  
  // Initial log
  verboseLog('Table Selection Logger Initialized', {
    totalCells: table.querySelectorAll('td').length,
    editableCells: table.querySelectorAll('td[contenteditable="true"]').length,
    browser: navigator.userAgent.includes('Firefox') ? 'Firefox' : 'Other'
  });
});

// Periodic check for any selection changes (catches edge cases)
setInterval(() => {
  const selection = window.getSelection();
  if (selection.rangeCount > 0 && !selection.isCollapsed) {
    const selectedText = selection.toString();
    if (selectedText.length > 0) {
      console.log('[Periodic Check] Active selection detected:', selectedText);
    }
  }
}, 2000);
</script>

</body>
</html>
