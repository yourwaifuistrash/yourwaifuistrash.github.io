<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Spreadsheet Tabs</title>
    <base target="_top">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Hide all sheet containers by default */
        .sheet-container {
            display: none;
        }
        
        /* Show sheet1 by default (when no hash or hash is #sheet1) */
        #sheet1 {
            display: block;
        }
        
        /* When sheet2 is targeted, show it and hide sheet1 */
        #sheet2:target {
            display: block;
        }
        
        #sheet2:target ~ #sheet1 {
            display: none;
        }
    </style>
</head>
<body class="tabs-only">
    <!-- Sheet 2 container (must come first for CSS sibling selector to work) -->
    <div id="sheet2" class="sheet-container">
        <nav class="sheet-tabs" aria-label="Spreadsheets">
            <a class="sheet-tab sheet-tab--add" href="#add-sheet" title="Add sheet" aria-label="Add sheet">+</a>
            <a class="sheet-tab" href="1.html" data-sheet-id="1">Sheet 1</a>
            <a class="sheet-tab sheet-tab--active" href="2.html" data-sheet-id="2" aria-current="page">Sheet 2</a>
        </nav>
    </div>
    
    <!-- Sheet 1 container -->
    <div id="sheet1" class="sheet-container">
        <nav class="sheet-tabs" aria-label="Spreadsheets">
            <a class="sheet-tab sheet-tab--add" href="#add-sheet" title="Add sheet" aria-label="Add sheet">+</a>
            <a class="sheet-tab sheet-tab--active" href="1.html" data-sheet-id="1" aria-current="page">Sheet 1</a>
            <a class="sheet-tab" href="2.html" data-sheet-id="2">Sheet 2</a>
        </nav>
    </div>
</body>
</html>
