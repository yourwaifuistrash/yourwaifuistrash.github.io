<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet Tabs</title>
    <base target="_parent">
    <link rel="stylesheet" href="style.css">
    <script>
        // Fallback to local assets when loader.js cannot be fetched
        function loadLocalAssetsFallback() {
            if (window.__tabsLocalAssetFallbackApplied) return;
            window.__tabsLocalAssetFallbackApplied = true;
            var script = document.createElement('script');
            script.src = 'app.js';
            script.defer = true;
            document.head.appendChild(script);
        }
        (function() {
            if (window.self !== window.top) return;
            const target = '1.html' + (window.location.search || '') + (window.location.hash || '');
            try { window.location.replace(target); } catch (e) { window.location.href = target; }
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=1.html">
    </noscript>
</head>
<body class="tabs-only">
    <nav id="sheetTabs" class="sheet-tabs" aria-label="Spreadsheets" data-current-sheet="1">
        <a class="sheet-tab sheet-tab--add" href="#add-sheet" data-sheet-add="true" title="Add sheet" aria-label="Add sheet">+</a>
        <div class="sheet-tabs__list">
            <a class="sheet-tab sheet-tab--active" href="1.html" data-sheet-id="1" aria-current="page">1</a>
            <a class="sheet-tab" href="2.html" data-sheet-id="2">2</a>
        </div>
    </nav>
    <noscript>
        <div class="sheet-tabs sheet-tabs--fallback" aria-hidden="true">
            <a class="sheet-tab" href="1.html">Sheet 1</a>
            <a class="sheet-tab" href="2.html">Sheet 2</a>
        </div>
    </noscript>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search || '');
            const preferLocal = ['1', 'true', 'local'].includes((params.get('localAssets') || '').toLowerCase()) || window.location.protocol === 'file:';
            if (preferLocal) {
                loadLocalAssetsFallback();
                return;
            }
            const script = document.createElement('script');
            script.src = 'loader.js';
            script.defer = true;
            script.onerror = loadLocalAssetsFallback;
            document.body.appendChild(script);
        }());
    </script>
</body>
</html>
